[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.5
    mikalhart/TinyGPSPlus@^1.0.3
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
