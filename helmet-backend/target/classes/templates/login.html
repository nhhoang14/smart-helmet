<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="login-page">
<main class="login-card">
    <div class="login-brand">
        <img class="login-mark" th:src="@{/favicon.svg}" alt="Smart Helmet Logo" width="56" height="56">
        <p class="login-kicker">SMART HELMET</p>
        <h1>Chào mừng trở lại</h1>
        <p class="login-subtitle">Đăng nhập để tiếp tục giám sát an toàn</p>
    </div>
    <form class="form-card" method="post" th:action="@{/login}">
        <div class="login-alert error" th:if="${error}" th:text="${error}" role="alert"></div>
        <label>Tên đăng nhập
            <input name="username" required autocomplete="username" autofocus
                   placeholder="Nhập tên đăng nhập" th:value="${username}">
        </label>
        <label>Mật khẩu
            <input type="password" name="password" required autocomplete="current-password"
                   placeholder="Nhập mật khẩu">
        </label>
        <button class="button primary full login-submit" type="submit">Đăng nhập</button>
    </form>
    <p class="login-footer">Kết nối bảo mật · Hệ thống Smart Helmet</p>
</main>
</body>
</html>
