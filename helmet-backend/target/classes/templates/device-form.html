<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><aside th:replace="~{fragments/layout :: sidebar(${activeTab})}"></aside><main class="content narrow"><div class="page-heading"><div><p class="eyebrow">THIẾT BỊ</p><h1 th:text="${editMode ? 'Chỉnh sửa thiết bị' : 'Đăng ký mũ mới'}">Đăng ký mũ mới</h1></div></div><form class="card form-card" method="post" th:action="${editMode} ? @{/devices/{uid}/edit(uid=${device.deviceUid})} : @{/devices/new}"><p class="error" th:if="${error}" th:text="${error}"></p><p class="form-help" th:if="${!editMode}">Nhập mã duy nhất được in trên thiết bị hoặc mã MAC/serial đã cấu hình trong firmware. Mã này phải trùng với phần mã trong topic MQTT.</p><label>Mã thiết bị duy nhất<input name="deviceUid" required pattern="[A-Za-z0-9][A-Za-z0-9_-]{2,99}" placeholder="HELMET_001 hoặc ESP32_A1B2C3" th:value="${device != null ? device.deviceUid : ''}" th:readonly="${editMode}"></label><label>Tên hiển thị<input name="name" required placeholder="Mũ bảo hộ #01" th:value="${device != null ? device.name : ''}"></label><label>Người sử dụng<input name="workerName" placeholder="Tên công nhân" th:value="${device != null ? device.workerName : ''}"></label><div class="form-actions"><a class="button" th:href="@{/devices}">Hủy</a><button class="button primary" type="submit" th:text="${editMode ? 'Lưu thay đổi' : 'Đăng ký'}">Đăng ký</button></div></form></main></body></html>
