<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><aside th:replace="~{fragments/layout :: sidebar(${activeTab})}"></aside><main class="content narrow"><div class="page-heading"><div><p class="eyebrow">CẤU HÌNH</p><h1>Ngưỡng cảnh báo</h1><p class="muted">Thiết lập theo từng mũ bảo hộ.</p></div></div><form class="filter-bar" method="get"><select name="deviceUid" onchange="this.form.submit()"><option th:each="device : ${devices}" th:value="${device.deviceUid}" th:text="${device.name}" th:selected="${device.deviceUid == selectedUid}"></option></select></form><form th:if="${threshold != null}" class="card form-card" method="post" th:action="@{/settings/{uid}(uid=${selectedUid})}"><p class="success" th:if="${successMsg}" th:text="${successMsg}"></p><label>Ngưỡng khí cảnh báo (ppm)<input type="number" name="gasWarn" min="0" step="1" required th:value="${threshold.gasWarn}"></label><label>Ngưỡng khí nguy hiểm (ppm)<input type="number" name="gasDanger" min="0" step="1" required th:value="${threshold.gasDanger}"></label><label>Ngưỡng va chạm té ngã (g)<input type="number" name="fallSensitivity" min="0" step="0.1" required th:value="${threshold.fallSensitivity}"></label><label>Thời gian xác nhận bất động (giây)<input type="number" name="fallInactivitySec" min="1" required th:value="${threshold.fallInactivitySec}"></label><div class="form-actions"><button class="button primary" type="submit">Lưu cấu hình</button></div></form></main></body></html>
