server:
  port: 8080

spring:
  application:
    name: helmet-backend
  datasource:
    url: jdbc:mysql://localhost:3306/helmet_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

# MQTT Configuration
mqtt:
  enabled: true
  broker-url: tcp://localhost:1883
  client-id: helmet-backend-server
  username: ""
  password: ""
  sub-topics:
    - "helmet/+/telemetry"
    - "helmet/+/event"
    - "helmet/+/status"

# Helmet IoT Settings
helmet:
  default-device-id: "01"
  offline-check-interval-ms: 5000
  simulation:
    # Tự động giả lập dữ liệu thực tế đẩy vào DB và WebSocket khi không có phần cứng ESP32 thật
    enabled: true
    interval-ms: 2000

logging:
  level:
    com.helmet: INFO
    org.springframework.web: INFO
    org.eclipse.paho: WARN
