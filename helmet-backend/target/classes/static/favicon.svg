      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="ridgeGrad" x1="24" y1="9" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FEE2E2"/>
    </linearGradient>
  </defs>
  <!-- Background rounded box -->
  <rect width="48" height="48" rx="12" fill="url(#bgGrad)"/>
  
  <!-- Safety Helmet -->
  <g>
    <!-- Helmet Dome -->
    <path d="M24 10C16.82 10 11 15.82 11 23V27C11 27.55 11.45 28 12 28H36C36.55 28 37 27.55 37 27V23C37 15.82 31.18 10 24 10Z" fill="#FFFFFF"/>
