<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><aside th:replace="~{fragments/layout :: sidebar(${activeTab})}"></aside><main class="content"><div class="page-heading"><div><p class="eyebrow">DỮ LIỆU CẢM BIẾN</p><h1>Lịch sử telemetry</h1><p class="muted">Các mẫu dữ liệu được lưu theo chu kỳ cấu hình.</p></div></div><form class="filter-bar" method="get"><select name="deviceUid"><option th:each="device : ${devices}" th:value="${device.deviceUid}" th:text="${device.name}" th:selected="${device.deviceUid == selectedUid}"></option></select><button class="button" type="submit">Tải dữ liệu</button></form><div class="card table-card"><table><thead><tr><th>Thời gian</th><th>Khí (ppm)</th><th>Gia tốc (g)</th><th>Đội mũ</th><th>GPS</th></tr></thead><tbody><tr th:each="item : ${telemetry}"><td th:text="${#temporals.format(item.logTime, 'dd/MM/yyyy HH:mm:ss')}">-</td><td><strong th:text="${#numbers.formatDecimal(item.gasPpm, 1, 1)}">0</strong></td><td th:text="${#numbers.formatDecimal(item.accMagnitude, 1, 2)}">1.00</td><td th:text="${item.isWorn ? 'Có' : 'Không'}">Có</td><td th:text="${item.latitude != null ? item.latitude + ', ' + item.longitude : 'N/A'}">N/A</td></tr><tr th:if="${telemetry == null or telemetry.isEmpty()}"><td colspan="5" class="empty-inline">Chưa có dữ liệu trong khoảng thời gian này.</td></tr></tbody></table></div></main></body></html>
