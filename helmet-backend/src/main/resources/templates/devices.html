<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><aside th:replace="~{fragments/layout :: sidebar(${activeTab})}"></aside>
<main class="content"><div class="page-heading"><div><p class="eyebrow">QUẢN LÝ</p><h1>Thiết bị</h1><p class="muted">Danh sách các mũ bảo hộ đang được giám sát.</p></div><a class="button primary" th:href="@{/devices/new}">+ Thêm thiết bị</a></div>
<div class="card table-card"><table><thead><tr><th>Thiết bị</th><th>Mã</th><th>Người sử dụng</th><th>Trạng thái</th><th>Cập nhật</th><th></th></tr></thead><tbody><tr th:each="device : ${devices}"><td><strong th:text="${device.name}">Mũ #01</strong></td><td><code th:text="${device.deviceUid}">01</code></td><td th:text="${device.workerName ?: 'Chưa gán'}">Chưa gán</td><td><span class="online-chip" th:classappend="${device.isOnline ? '' : ' offline'}" th:text="${device.isOnline ? 'ONLINE' : 'OFFLINE'}">OFFLINE</span></td><td th:text="${device.lastSeenAt != null ? #temporals.format(device.lastSeenAt, 'dd/MM HH:mm') : 'Chưa có dữ liệu'}">-</td><td class="actions"><a class="text-link" th:href="@{/dashboard(deviceUid=${device.deviceUid})}">Mở</a><a class="text-link" th:href="@{/devices/{uid}/edit(uid=${device.deviceUid})}">Sửa</a><form method="post" th:action="@{/devices/{uid}/delete(uid=${device.deviceUid})}"><button class="link-button danger-text" type="submit">Xóa</button></form></td></tr><tr th:if="${devices.isEmpty()}"><td colspan="6" class="empty-inline">Chưa có thiết bị.</td></tr></tbody></table></div></main></body></html>
