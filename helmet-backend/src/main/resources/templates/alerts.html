<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><aside th:replace="~{fragments/layout :: sidebar(${activeTab})}"></aside><main class="content"><div class="page-heading"><div><p class="eyebrow">AN TOÀN</p><h1>Cảnh báo</h1><p class="muted">Theo dõi và xác nhận các sự cố từ thiết bị.</p></div></div>
<form class="filter-bar" method="get" th:action="@{/alerts}"><select name="type"><option value="">Tất cả loại</option><option value="GAS_WARNING" th:selected="${filterType == 'GAS_WARNING'}">Khí cảnh báo</option><option value="GAS_DANGER" th:selected="${filterType == 'GAS_DANGER'}">Khí nguy hiểm</option><option value="FALL" th:selected="${filterType == 'FALL'}">Té ngã</option><option value="SOS" th:selected="${filterType == 'SOS'}">SOS</option><option value="OFFLINE" th:selected="${filterType == 'OFFLINE'}">Mất kết nối</option></select><select name="status"><option value="">Mọi trạng thái</option><option value="NEW" th:selected="${filterStatus == 'NEW'}">Chưa xử lý</option><option value="ACKNOWLEDGED" th:selected="${filterStatus == 'ACKNOWLEDGED'}">Đã xác nhận</option></select><button class="button" type="submit">Lọc</button></form>
<div class="card table-card"><table><thead><tr><th>Mức độ</th><th>Nội dung</th><th>Thiết bị</th><th>Thời gian</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="alert : ${alerts}"><td><span class="severity" th:classappend="${alert.severity.name() == 'DANGER' ? ' danger' : ' warning'}" th:text="${alert.severity.name() == 'DANGER' ? '!' : '△'}">!</span></td><td><strong th:text="${alert.message}">Cảnh báo</strong></td><td><code th:text="${alert.deviceUid}">01</code></td><td th:text="${#temporals.format(alert.occurredAt, 'dd/MM/yyyy HH:mm')}">-</td><td><span class="status-label" th:text="${alert.status.name() == 'NEW' ? 'Chưa xử lý' : 'Đã xác nhận'}">Chưa xử lý</span></td><td><form th:if="${alert.status.name() == 'NEW'}" method="post" th:action="@{/alerts/{id}/ack(id=${alert.id})}"><button class="button small" type="submit">Xác nhận</button></form></td></tr><tr th:if="${alerts.isEmpty()}"><td colspan="6" class="empty-inline">Không có cảnh báo phù hợp.</td></tr></tbody></table></div>
<div class="pagination" th:if="${totalPages > 1}"><a th:if="${currentPage > 0}" th:href="@{/alerts(page=${currentPage - 1},type=${filterType},status=${filterStatus})}">← Trước</a><span th:text="${currentPage + 1 + ' / ' + totalPages}">1 / 1</span><a th:if="${currentPage + 1 < totalPages}" th:href="@{/alerts(page=${currentPage + 1},type=${filterType},status=${filterStatus})}">Sau →</a></div></main></body></html>
