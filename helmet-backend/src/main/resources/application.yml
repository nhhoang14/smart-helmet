server:
  port: 8080

spring:
  application:
    name: helmet-backend
  datasource:
    url: jdbc:mysql://localhost:3306/helmet_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

# MQTT Configuration
mqtt:
  enabled: true
  broker-url: tcp://localhost:1883
  client-id: helmet-backend-server
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  sub-topics:
    - "helmet/device/+/telemetry"
    - "helmet/device/+/alert"
    - "helmet/device/+/status"
    - "helmet/device/+/state"
    - "helmet/+/telemetry"
    - "helmet/+/event"
    - "helmet/+/status"

# Helmet IoT Settings
helmet:
  default-device-id: "HELMET_001"
  offline-check-interval-ms: 5000
  simulation:
    device-id: "HELMET_002"
    # Mũ 001 nhận dữ liệu thật từ ESP32; mũ 002 phát dữ liệu mô phỏng.
    enabled: true
    interval-ms: 2000

logging:
  level:
    com.helmet: INFO
    org.springframework.web: INFO
    org.eclipse.paho: WARN
