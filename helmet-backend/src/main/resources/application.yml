server:
  port: 8080

spring:
  application:
    name: helmet-backend
  # Gắn mã băm nội dung vào link CSS/JS (vd: /css/helmet-3fa2c1.css) để trình duyệt
  # luôn tải bản mới sau mỗi lần build, không dùng lại bản cũ trong bộ nhớ đệm.
  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
  datasource:
    url: jdbc:mysql://localhost:3306/helmet_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

# MQTT Configuration
mqtt:
  enabled: true
  broker-url: tcp://localhost:1883
  client-id: helmet-backend-server
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  sub-topics:
    - "helmet/device/+/telemetry"
    - "helmet/device/+/alert"
    - "helmet/device/+/status"
    - "helmet/device/+/state"
    - "helmet/device/+/location"
    - "helmet/device/+/wifiscan"
    - "helmet/+/telemetry"
    - "helmet/+/event"
    - "helmet/+/status"
    - "helmet/+/location"

# Helmet IoT Settings
helmet:
  default-device-id: "HELMET_002"
  offline-check-interval-ms: 5000
  simulation:
    # Mũ 001 nhận dữ liệu thật từ ESP32; mũ 002 phát dữ liệu mô phỏng.
    enabled: true
    interval-ms: 2000
    # Giả lập vị trí khu vực (phòng 301 / hành lang) để xem sơ đồ khi chưa có mũ thật.
    # Khi chạy với mũ thật: đặt enabled (ở trên) thành false để không ghi đè số liệu và vị trí thật.
    zone-enabled: true
  # Định vị khu vực bằng Wi-Fi fingerprint (mũ gửi bản quét lên topic helmet/device/{uid}/wifiscan)
  wifi-fingerprint:
    enabled: true
    # CSV "ts,label,bssid,rssi" từ tools/collect_wifi.py; label = mã khu vực (phong_301, hanh_lang).
    # Đường dẫn tính từ thư mục chạy lệnh java (thường là helmet-backend/).
    train-file: "data/wifi_train.csv"
    k: 5
    floor-dbm: -90
    # Khoảng cách tới mẫu gần nhất lớn hơn số này -> "unknown". 0 = tắt. Chỉnh sau khi có dữ liệu.
    unknown-distance: 0
    # Lấy đa số của N lần quét gần nhất (mỗi lần ~3 giây)
    smoothing-window: 3

logging:
  level:
    com.helmet: INFO
    org.springframework.web: INFO
    org.eclipse.paho: WARN
