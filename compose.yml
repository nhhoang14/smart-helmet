# Retain the existing Docker project/volume so local users and history stay intact.
name: github-smart-helmet
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: helmet_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-helmet_local_dev}
    volumes:
      - helmet-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
  backend:
    build: ./helmet-backend
    depends_on:
      mysql:
        condition: service_healthy
      mqtt:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/helmet_db?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-helmet_local_dev}
      MQTT_BROKER_URL: tcp://mqtt:1883
      HELMET_SIMULATION_ENABLED: "true"
      HELMET_SIMULATION_DEVICE_ID: HELMET_002
      HELMET_DEFAULT_DEVICE_ID: HELMET_001
volumes:
  helmet-mysql:
